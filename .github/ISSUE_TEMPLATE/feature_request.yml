name: Feature request
description: Propose a product or platform improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend/API
        - Frontend/UI
        - Collaboration
        - Data processing
        - Security
        - Operations
        - Documentation
  - type: textarea
    id: notes
    attributes:
      label: Additional context
