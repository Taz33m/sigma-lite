name: Bug report
description: Report a reproducible problem in SigmaLite.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for maintainers to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start backend with ...
        2. Start frontend with ...
        3. Upload ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment
      description: OS, Python version, Node version, browser.
      placeholder: macOS 14, Python 3.11, Node 22, Chrome 126
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets before pasting logs.
