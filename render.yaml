services:
  - type: web
    name: sigmalite-api
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/Taz33m/sigma-lite
    branch: main
    autoDeploy: true
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: sigmalite-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sigmalite-redis
          type: keyvalue
          property: connectionString
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DISABLE_AUTH
        value: false
      - key: ENABLE_OTEL
        value: false
      - key: EXPOSE_API_DOCS
        value: false
      - key: EXPOSE_PUBLIC_METRICS
        value: false
      - key: METRICS_TOKEN
        sync: false
      - key: TRUST_PROXY_CLIENT_IP_HEADER
        sync: false
      - key: MAX_EXPORT_ROWS
        value: "100000"
      - key: MAX_FORMULA_LENGTH
        value: "512"
      - key: MAX_FORMULA_EVAL_ROWS
        value: "100000"
      - key: WS_TICKET_TTL_SECONDS
        value: "60"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/sigmalite-uploads

  - type: keyvalue
    name: sigmalite-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: sigmalite-postgres
    databaseName: sigmalite
    user: sigmalite
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
